#
# Based on https://github.com/maratori/golangci-lint-config (golden config for golangci-lint v2),
# adapted for the standards in docs/standards/go.md:
#   - enabled: ireturn, interfacebloat, inamedparam, wrapcheck (small, documented ports;
#     concrete return types; errors wrapped with context)
#   - doc comments and receiver naming are enforced (ST1000, ST1016 and the revive comment
#     rules are no longer excluded)
#   - test files keep errcheck, bodyclose, and noctx (test code meets production standards)
#   - depguard also bans non-slog logging libraries; sloglint requires typed attributes
#   - misspell stays off: it knows US and UK English only, and prose here is Canadian
#   - ClickHouse and Prometheus specific settings dropped (OTel only); exhaustive uses
#     "map" because golangci-lint 2.14 (the devbox version) rejects "mapliteral"
# Package dependency rules (domain packages never import each other) live in each
# project's .go-arch-lint.yml, not here.

version: "2"

issues:
  max-same-issues: 50

formatters:
  enable:
    - goimports
    - golines

  settings:
    goimports:
      local-prefixes:
        - github.com/WillerTravassos/showcase

    golines:
      max-len: 120

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - cyclop
    - depguard
    - dupl
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - funcorder
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - iface
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - makezero
    - mirror
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testifylint
    - testpackage
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck

  settings:
    cyclop:
      max-complexity: 30
      package-average: 10.0

    depguard:
      rules:
        "deprecated":
          files:
            - "$all"
          deny:
            - pkg: github.com/golang/protobuf
              desc: Use google.golang.org/protobuf instead, see https://developers.google.com/protocol-buffers/docs/reference/go/faq#modules
            - pkg: github.com/satori/go.uuid
              desc: Use github.com/google/uuid instead, satori's package is not maintained
            - pkg: github.com/gofrs/uuid$
              desc: Use github.com/gofrs/uuid/v5 or later, it was not a go module before v5
        "logging":
          files:
            - "$all"
          deny:
            - pkg: github.com/sirupsen/logrus
              desc: Use log/slog, see docs/standards/observability.md
            - pkg: go.uber.org/zap
              desc: Use log/slog, see docs/standards/observability.md
            - pkg: github.com/rs/zerolog
              desc: Use log/slog, see docs/standards/observability.md
        "non-test files":
          files:
            - "!$test"
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2 instead, see https://go.dev/blog/randv2
        "non-main files":
          files:
            - "!**/main.go"
          deny:
            - pkg: log$
              desc: Use log/slog instead, see https://go.dev/blog/slog

    embeddedstructfieldcheck:
      forbid-mutex: true

    errcheck:
      check-type-assertions: true

    exhaustive:
      check:
        - switch
        - map

    funcorder:
      struct-method: false

    funlen:
      lines: 100
      statements: 50

    gochecksumtype:
      default-signifies-exhaustive: false

    gocognit:
      min-complexity: 20

    gocritic:
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false

    godoclint:
      enable:
        - no-unused-link
        - require-stdlib-doclink

    govet:
      enable-all: true
      disable:
        - fieldalignment # too strict
      settings:
        shadow:
          strict: true

    inamedparam:
      skip-single-param: true

    mnd:
      ignored-functions:
        - args.Error
        - flag.Arg
        - flag.Duration.*
        - flag.Float.*
        - flag.Int.*
        - flag.Uint.*
        - os.Chmod
        - os.Mkdir.*
        - os.OpenFile
        - os.WriteFile

    nakedret:
      max-func-lines: 0

    nolintlint:
      allow-no-explanation: [ funlen, gocognit, golines ]
      require-explanation: true
      require-specific: true

    perfsprint:
      strconcat: false
      error-format: false # https://github.com/catenacyber/perfsprint/issues/62

    reassign:
      patterns:
        - ".*"

    sloglint:
      no-global: all
      context: scope
      attr-only: true

    staticcheck:
      checks:
        - all
        - -QF1008 # omit embedded fields from selector expression

    usetesting:
      os-temp-dir: true

  exclusions:
    warn-unused: true
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - source: 'TODO'
        linters: [ godot ]
      - path: '_test\.go'
        linters:
          - dupl
          - funlen
          - goconst
          - gosec
          - wrapcheck
