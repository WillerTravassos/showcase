# Cilium as CNI (container network interface), kube-proxy replacement, and Gateway API
# implementation (clinic-scheduler ADR 0011), with kind values. Rendered by
# `kustomize build --enable-helm`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: cilium
    repo: https://helm.cilium.io
    version: 1.20.5
    releaseName: cilium
    namespace: kube-system
    valuesInline:
      kubeProxyReplacement: true
      # Without kube-proxy the agent cannot use the kubernetes Service to find the API
      # server; this is the kind control-plane container.
      k8sServiceHost: local-control-plane
      k8sServicePort: 6443
      ipam:
        mode: kubernetes
      operator:
        replicas: 1
      gatewayAPI:
        enabled: true
        # "auto" looks up the CRD in the live cluster, which a kustomize render cannot.
        gatewayClass:
          create: "true"
        # Envoy listens on the node's ports 80 and 443, which tilt/cluster.yaml maps to
        # 127.0.0.1 on the host.
        hostNetwork:
          enabled: true
      envoy:
        securityContext:
          capabilities:
            # Ports below 1024 need NET_BIND_SERVICE, kept after the Envoy starter drops
            # the other capabilities.
            keepCapNetBindService: true
            envoy: [NET_ADMIN, SYS_ADMIN, NET_BIND_SERVICE]
      hubble:
        # No Hubble relay, so no TLS between agents and relay; this also keeps the chart
        # from generating new certificates on every render.
        tls:
          enabled: false
