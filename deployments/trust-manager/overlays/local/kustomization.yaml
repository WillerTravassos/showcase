# trust-manager copies the local CA certificate into a ConfigMap in every namespace
# (clinic-scheduler ADR 0012). Its webhook certificate comes from cert-manager.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: trust-manager
    repo: https://charts.jetstack.io
    version: v0.26.0
    releaseName: trust-manager
    namespace: cert-manager
    includeCRDs: true
