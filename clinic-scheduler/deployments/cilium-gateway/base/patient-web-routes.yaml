# Plain HTTP to patient.localhost is redirected to HTTPS; HTTPS goes to patient-web.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: patient-web-https-redirect
spec:
  parentRefs:
    - name: clinic-scheduler
      sectionName: patient-http
  hostnames:
    - patient.localhost
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: patient-web
spec:
  parentRefs:
    - name: clinic-scheduler
      sectionName: patient-https
  hostnames:
    - patient.localhost
  rules:
    - backendRefs:
        - name: patient-web
          port: 80
