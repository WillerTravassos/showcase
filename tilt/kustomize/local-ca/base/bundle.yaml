# Publishes the local root as the ConfigMap local-ca-bundle (key ca.crt) in every
# namespace, for clients that must trust it.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: local-ca-bundle
spec:
  sources:
    - secret:
        name: local-ca
        key: ca.crt
  target:
    configMap:
      key: ca.crt
